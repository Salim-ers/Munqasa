<!doctype html>
<html lang="fr" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F1E9" />
    <script src="/theme-init.js"></script>
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <noscript><style>#root > .boot-fallback { visibility: visible; animation: none; }</style></noscript>
    <!--app-head-->
  </head>
  <body>
    <div id="root">
      <!-- Contenu de secours : visible seulement si le site ne démarre pas (JavaScript désactivé ou bloqué,
           navigateur trop ancien, réseau coupé). React le remplace dès le démarrage. -->
      <div class="boot-fallback">
        <p class="boot-fallback__brand">Talab Solutions</p>
        <p class="boot-fallback__tag">Appels d’offres au Maroc</p>
        <p class="boot-fallback__text">
          Talab Solutions accompagne les entreprises dans l’identification, l’analyse, la préparation et le suivi de leurs
          appels d’offres.
        </p>
        <p class="boot-fallback__note">
          Si le site ne s’affiche pas, rechargez la page, activez JavaScript ou ouvrez-la dans un navigateur à jour.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
